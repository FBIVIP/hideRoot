name: Build Developer_fateh7
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Fetch AndroidVMTools submodule
        run: |
          if [ ! -f external/AndroidVMTools/gradle/libs.versions.toml ]; then
            rm -rf external/AndroidVMTools
            git clone --depth 1 --recurse-submodules https://github.com/aerath-stuff/AndroidVMTools external/AndroidVMTools
          fi
          ls external/AndroidVMTools/gradle/libs.versions.toml
      - name: Install SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare build config
        run: |
          printf 'officialBuild=true\nlocalBuild=true\n' > local.properties
          chmod +x gradlew
      - name: Build manager APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Build Zygisk module
        run: ./gradlew :zygote:assembleRelease --no-daemon --stacktrace
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: Developer_fateh7-build
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/**/*.apk
            zygote/build/outputs/**/*.zip
            zygote/build/outputs/**/*.apk
