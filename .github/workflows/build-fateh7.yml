name: Build Developer_fateh7

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare build config
        run: |
          printf 'officialBuild=true\nlocalBuild=true\n' > local.properties
          chmod +x gradlew

      # The app APK is BOTH the manager and the LSPosed module (all in one).
      - name: Build app (LSPosed module + manager)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: List outputs
        if: always()
        run: find app/build/outputs/apk -name '*.apk' -print 2>/dev/null || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Developer_fateh7-app
          if-no-files-found: warn
          path: app/build/outputs/apk/**/*.apk
