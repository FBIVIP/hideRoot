pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Xposed API (compileOnly) lives here, not on mavenCentral
        maven { url 'https://api.xposed.info/' }
    }
}
rootProject.name = "HideRootApps"
include ':app'
